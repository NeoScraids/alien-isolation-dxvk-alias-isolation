# DXVK configuration for Alien: Isolation + Alias Isolation

# 1. Desactivar el limitador interno de DXVK para mantener el frame pacing estable
dxgi.maxFrameRate = -1

# 2. Desactivar V-Sync forzado en DXVK para evitar la caida a 90 FPS
dxgi.syncInterval = 0

# 3. Optimizar el uso de buffers dinamicos para el TAA de Alias Isolation
d3d11.cachedDynamicResources = a

# 4. Reducir la cola de renderizado
dxgi.maxFrameLatency = 1
