# DXVK configuration for Alien: Isolation + Alias Isolation

# 1. Disable DXVK's internal frame limiter (cap FPS externally: RTSS / Radeon Chill / NVIDIA)
#    Desactivar el limitador interno de DXVK (limita los FPS con RTSS / Chill / NVIDIA)
dxgi.maxFrameRate = -1

# 2. Force V-Sync off to avoid the half-refresh (e.g. 90 FPS) lock.
#    Use a FreeSync/G-Sync monitor + an FPS cap below the refresh rate to avoid tearing.
#    Forzar V-Sync desactivado para evitar la caida a la mitad del refresco.
#    Usa FreeSync/G-Sync y un limite por debajo del refresco para evitar el tearing.
dxgi.syncInterval = 0

# 3. Shorter render queue (lower input latency)
#    Reducir la cola de renderizado (menos latencia)
dxgi.maxFrameLatency = 1

# 4. Performance HUD - remove the leading "#" to enable it
#    HUD de rendimiento - quita la "#" inicial para activarlo
# dxvk.hud = fps,frametimes
